services:
  - type: web
    name: lumina-backend
    region: oregon
    plan: starter
    runtime: node
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /docs
    envVars:
      # --- Banco de dados (Supabase) ---
      # Substitua pelo DATABASE_URL do seu projeto Supabase:
      # https://app.supabase.com -> Project Settings -> Database -> Connection string
      # Formato: postgresql://postgres:<password>@db.<ref>.supabase.co:5432/postgres?schema=public
      - key: DATABASE_URL
        value: ""
      - key: SHADOW_DATABASE_URL
        value: ""

      # --- Aplicação ---
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: "https://app.lumina.com.br"
      - key: FRONTEND_URL
        value: "https://app.lumina.com.br"

      # --- JWT ---
      # Gere com: openssl rand -hex 32
      - key: JWT_SECRET
        value: ""
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_SECRET
        value: ""
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"

      # --- Google OAuth 2.0 ---
      # Crie as credenciais em: https://console.cloud.google.com/apis/credentials
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_CALLBACK_URL
        value: "https://lumina-backend.onrender.com/auth/google/callback"

      # --- E-mail transacional (Resend) ---
      # Opcional: sem RESEND_API_KEY, o MailerService simula o envio no console.
      - key: RESEND_API_KEY
        value: ""
      - key: RESEND_FROM_EMAIL
        value: "Lumina <onboarding@resend.dev>"
